<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>TEAM</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* layout: one column, three team tabs on top (Safwa / Sharks / Dolphin); same look as TAREK's Fitness tab */
:root{
  --bg:#F2F5F9; --card:#FFFFFF; --ink:#0F1C2C; --muted:#5D6B7D; --line:#DBE3EC;
  --blue:#1F5FBF; --tint:#E7EFFA; --gold:#9A6A12; --goldtint:#FBF2DF;
  --warn:#C25E0C; --ok:#1E7A4C; --oktint:#E3F4EA; --bad:#B23A2E; --badtint:#FBE7E4;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1420; --card:#132235; --ink:#E5EDF7; --muted:#97A9BE; --line:#22364D;
  --blue:#6FA3F2; --tint:#17304D; --gold:#E7B65A; --goldtint:#33280F;
  --warn:#FFA352; --ok:#5ED19A; --oktint:#123526; --bad:#FF8C7E; --badtint:#3A1C19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1420; --card:#132235; --ink:#E5EDF7; --muted:#97A9BE; --line:#22364D;
  --blue:#6FA3F2; --tint:#17304D; --gold:#E7B65A; --goldtint:#33280F;
  --warn:#FFA352; --ok:#5ED19A; --oktint:#123526; --bad:#FF8C7E; --badtint:#3A1C19; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);direction:ltr;margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-size:32px;margin:0;line-height:1.1;letter-spacing:.06em}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;padding-block:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;font:600 14px var(--body);border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:var(--card)}
.tabs button.due::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-inline-start:7px;vertical-align:middle}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.panel{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.row > *{flex:1 1 120px;min-width:0}
label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);font-weight:500}
select,input{font:15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0;height:42px;margin:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
.full{flex:1 1 100%!important}
.btn{font:600 15px var(--body);background:var(--blue);color:var(--card);border:0;border-radius:9px;padding:9px 16px;cursor:pointer}
.btn.alt{background:none;color:var(--blue);border:1.5px solid var(--blue)}
.btn:disabled{opacity:.6;cursor:default}
.err{color:var(--bad);font-size:13px;margin:0}
.x{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:3px 9px;font:13px var(--body);cursor:pointer}
.x.arm{border-color:var(--bad);color:var(--bad);background:var(--badtint)}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:14px 0;margin:0}
.note{font-size:12.5px;color:var(--muted);margin:0}
.warn{font-size:13px;color:var(--bad);background:var(--badtint);border-radius:10px;padding:8px 12px;margin:0}
.pv{font-size:13px;color:var(--gold);background:var(--goldtint);border-radius:10px;padding:8px 12px;margin:0}
.sub{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.sub b{color:var(--ink)}
summary.x{display:inline-block;list-style:none}
summary.x::-webkit-details-marker{display:none}
.pvEd[open] summary.x{border-color:var(--blue);color:var(--blue)}
.bk{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.imp{display:inline-block;cursor:pointer}
.fr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.fr:first-child{border-top:0}
.fr .fn{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.fr .fn small{font:600 12px var(--display);color:var(--muted)}
.fr .ed{font-size:11.5px;padding:1px 7px}
.fnm{background:none;border:0;padding:0;font:600 15px var(--body);color:inherit;cursor:pointer;text-align:start;text-decoration:underline dotted var(--muted);text-underline-offset:4px;overflow-wrap:anywhere}
.fr.soon .fnm{color:var(--warn)}
.fno{min-width:22px;height:22px;border-radius:999px;background:var(--tint);color:var(--blue);font:700 13px var(--display);display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.fbx{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:5px}
.fc{height:40px;border-radius:7px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);padding:0 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.fc .fw{font:600 11px var(--body);color:var(--muted)}
.fc .fd{font:600 13px var(--display);font-variant-numeric:tabular-nums;color:var(--muted)}
.fc .fm{font:700 12px var(--body)}
.fc.p{background:var(--oktint);border-color:var(--ok);color:var(--ok)}
.fc.a{background:var(--badtint);border-color:var(--bad);color:var(--bad)}
.fc.p .fd,.fc.a .fd,.fc.p .fw,.fc.a .fw{color:inherit}
.fc.today{border-color:var(--blue)}
.fct{font:700 15px var(--display);text-align:center;font-variant-numeric:tabular-nums}
.frn{font:600 12.5px var(--body);border:1.5px solid var(--warn);color:var(--warn);background:var(--goldtint);border-radius:8px;padding:6px 10px;cursor:pointer}
.fed{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:10px;padding:10px}
.fh{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:13.5px;padding:6px 0;border-top:1px solid var(--line)}
.fh b{font:700 15px var(--display);color:var(--muted)}
.fh.cur b,.fh.cur span{color:var(--ink)}
.fh .fhs{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.fh .fh-del{font-size:11.5px;padding:1px 7px}
.fold{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:8px}
.fold .row>label{flex:1 1 70px}
.flast{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14.5px}
.flast b{font:700 18px var(--display)}
.flast .ok{color:var(--ok)}
.flast .bad{color:var(--bad)}
.login{display:flex;flex-direction:column;gap:12px;max-width:380px;width:100%;margin:24px auto 0}
.login .btn{margin-top:4px}
.lt{margin:0;font-weight:600;font-size:15px}
#app{width:100%;max-width:none;margin:0}
.cardOv{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 14px;overflow:auto}
.cardOv img{max-width:100%;height:auto;border-radius:6px;background:#fff}
.cardOv .row2{display:flex;gap:10px}
.cardOv a.btn{text-decoration:none;display:inline-block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="top"><h1>TEAM</h1><button class="x" type="button" id="outBtn" hidden>Sign out</button></div>
  <p class="warn" id="fail" role="alert" hidden></p>

  <form class="card login" id="login" novalidate hidden>
    <p class="lt">Sign in</p>
    <label>Email<input id="lgEmail" type="email" autocomplete="username" inputmode="email"></label>
    <label>Password<input id="lgPass" type="password" autocomplete="current-password"></label>
    <button class="btn" type="submit" id="lgBtn">Sign in</button>
    <p class="err" id="lgErr" hidden></p>
  </form>
  <p class="note" id="booting" style="text-align:center">Loading…</p>

  <div id="app" class="wrap" hidden>

  <nav class="tabs" role="tablist" id="tabs"></nav>

  <section class="panel" id="panel">
    <div class="sub" id="sum"></div>
    <div class="card" id="list"></div>
    <p class="note" id="howto"></p>
    <div class="flast" id="last" hidden></div>
    <details class="pvEd" id="addWrap"><summary class="x">Edit swimmers</summary>
      <div class="card" style="margin-top:8px;display:flex;flex-direction:column;gap:10px">
        <form class="row" id="addF" novalidate>
          <label class="full">Swimmer name<input id="aName" maxlength="40" autocomplete="off"></label>
          <label style="flex:1 1 0">Start date<input id="aStart" type="date"></label>
          <label style="flex:0 0 90px">Sessions<input id="aN" type="number" inputmode="numeric" min="1" max="40"></label>
          <button class="btn" type="submit" style="flex:0 0 auto">Add</button>
        </form>
        <p class="err" id="addErr" hidden></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, collection as fCol, doc as fDoc, onSnapshot as fSnap, setDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const fbApp=initializeApp({
  apiKey:"AIzaSyCLxD-fduSa6kgqnk8pJj8HwtzY3AYfhIg",
  authDomain:"tarek-74842.firebaseapp.com",
  projectId:"tarek-74842",
  storageBucket:"tarek-74842.firebasestorage.app",
  messagingSenderId:"179196785540",
  appId:"1:179196785540:web:d4604f645dbbcc6e5f23d1"
});
const auth=getAuth(fbApp);
let fs; try{ fs=initializeFirestore(fbApp,{localCache:persistentLocalCache()}); }catch(e){ fs=initializeFirestore(fbApp,{}); }
const COL="team_swimmers";
const body=s=>JSON.parse(JSON.stringify(Object.fromEntries(Object.entries(s).filter(([k])=>k!=="id"))));
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const SHORT=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d);};
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return keyOf(d);};
const ddmm=k=>{const d=parse(k);return pad(d.getDate())+"/"+pad(d.getMonth()+1);};
const yy=k=>ddmm(k)+"/"+String(parse(k).getFullYear()).slice(2);
const wd=k=>SHORT[parse(k).getDay()];
const todayKey=keyOf(new Date());
let failT;
function fail(msg){const f=$("fail");f.textContent=msg||"Something didn't save. Check your internet and try again.";f.hidden=false;clearTimeout(failT);failT=setTimeout(()=>f.hidden=true,6000);}

/* TEAMS — training days (0=Sun … 6=Sat) and sessions in one month card */
const TEAMS=[
  {id:"safwa",name:"Safwa",days:[4,5,6,1,2],n:20},
  {id:"sharks",name:"Sharks",days:[4,5,6,1],n:16},
  {id:"dolphin",name:"Dolphin",days:[4,5,6,2],n:16}];
const TM=id=>TEAMS.find(t=>t.id===id);
let CUR="safwa", SW=[], OPEN=null, EDIT=null, OLD=null;

function nextTrain(team,k){ const d=TM(team).days; for(let i=0;i<14;i++){ const kk=addDays(k,i); if(d.includes(parse(kk).getDay())) return kk; } return k; }
function sessKeys(team,start,n){ const out=[]; let k=nextTrain(team,start); while(out.length<n){ out.push(k); k=nextTrain(team,addDays(k,1)); } return out; }
const nOf=s=>Math.max(1,+s.n||TM(s.team).n);
function marksOf(s){ const n=nOf(s), m=(s.marks||[]).slice(0,n); while(m.length<n) m.push(""); return m; }
function dayOpts(team,sel,back=60,fwd=30){ const out=[]; let k=nextTrain(team,addDays(todayKey,-back)); const end=addDays(todayKey,fwd); while(k<=end){ out.push(k); k=nextTrain(team,addDays(k,1)); } if(sel&&!out.includes(sel)) out.push(sel); out.sort();
  return out.map(k=>`<option value="${k}"${k===sel?" selected":""}>${wd(k)} ${ddmm(k)}/${parse(k).getFullYear()}</option>`).join(""); }

/* STORAGE — Firebase, collection team_swimmers (one document per swimmer) */
async function save(id,patch){
  const s=SW.find(x=>x.id===id); if(!s) return;
  Object.assign(s,patch); render();
  try{ await setDoc(fDoc(fs,COL,id),body(s)); }catch(x){ fail("Not saved. Check your internet and try again."); }
}
async function addSw(s){
  SW.push(s); render();
  try{ await setDoc(fDoc(fs,COL,s.id),body(s)); }catch(x){ SW=SW.filter(z=>z.id!==s.id); render(); const er=$("addErr"); er.textContent="Not saved. Try again."; er.hidden=false; }
}
async function delSw(id){
  const keep=[...SW]; SW=SW.filter(x=>x.id!==id); render();
  try{ await deleteDoc(fDoc(fs,COL,id)); }catch(x){ SW=keep; render(); fail("Not deleted. Try again."); }
}

/* RENDER */
function renderTabs(){
  $("tabs").innerHTML=TEAMS.map(t=>{
    const due=SW.some(s=>s.team===t.id&&isSoon(s));
    return `<button role="tab" type="button" data-tab="${t.id}" aria-selected="${t.id===CUR}" class="${due?"due":""}">${t.name}</button>`;}).join("");
}
function isSoon(s){ const m=marksOf(s); return m.filter(x=>!x).length<=1; }
function line(no,team,x,cur,idx){
  const n=x.marks?x.marks.length:(+x.n||TM(team).n), p=x.marks?x.marks.filter(v=>v==="p").length:(+x.p||0), a=x.marks?x.marks.filter(v=>v==="a").length:(+x.a||0);
  const ks=x.start?sessKeys(team,x.start,n):null;
  const range=ks?`${yy(ks[0])} → ${yy(ks[ks.length-1])}`:"No date";
  const del=cur?"":`<button type="button" class="x fh-del" data-hi="${idx}">Delete</button>`;
  return `<div class="fh${cur?" cur":""}"><b>#${no}</b><span>${range}</span><span class="fhs">✓ ${p} · ✗ ${a}${cur?" · now":""}</span>${del}</div>`;
}
function histHtml(s){
  const h=(s.hist||[]).map((x,i)=>({...x,_i:i})).sort((a,b)=>(a.start||"").localeCompare(b.start||""));
  const unrec=Math.max(0,(+s.renewals||0)-h.length), cur=h.length+unrec+1;
  let out=`<p class="note" style="margin:4px 0 0">Subscriptions</p>`+line(cur,s.team,{start:s.start,marks:marksOf(s)},true);
  h.slice().reverse().forEach((x,k)=>{ out+=line(unrec+h.length-k,s.team,x,false,x._i); });
  if(unrec) out+=`<p class="note" style="margin:0">${unrec} older renewal${unrec>1?"s":""} without details.</p>`;
  out+= OLD===s.id ? `<div class="fold">
      <div class="row"><label>Start<select class="fo-s">${dayOpts(s.team,null,400,0)}</select></label></div>
      <div class="row"><label>Sessions<input class="fo-n" type="number" inputmode="numeric" min="1" max="40" value="${TM(s.team).n}"></label>
      <label>Present<input class="fo-p" type="number" inputmode="numeric" min="0" value="${TM(s.team).n}"></label>
      <label>Absent<input class="fo-a" type="number" inputmode="numeric" min="0" value="0"></label></div>
      <div class="row" style="align-items:center"><button type="button" class="btn fo-save" style="flex:0 0 auto">Save</button><button type="button" class="x fo-no" style="flex:0 0 auto">Cancel</button></div></div>`
    : `<button type="button" class="x fo-open" style="align-self:flex-start">+ Add old subscription</button>`;
  return out;
}
function render(){
  renderTabs();
  const T=TM(CUR), rows=SW.filter(s=>s.team===CUR).sort((a,b)=>(a.order||0)-(b.order||0));
  let soon=0;
  if(!rows.length) $("list").innerHTML=`<p class="empty">No swimmers in ${T.name} yet. Open “Edit swimmers” below and add the first name.</p>`;
  else $("list").innerHTML=rows.map((s,ix)=>{
    const m=marksOf(s), n=m.length, ks=sessKeys(s.team,s.start,n), filled=m.filter(Boolean).length, pres=m.filter(x=>x==="p").length;
    const ended=ks[n-1]<todayKey, full=filled===n||ended, sn=isSoon(s)||ended; if(sn) soon++;
    const boxes=m.map((x,i)=>`<button type="button" class="fc ${x}${ks[i]===todayKey?" today":""}" data-id="${s.id}" data-i="${i}" aria-label="${wd(ks[i])} ${ddmm(ks[i])}"><span class="fw">${wd(ks[i])}</span><span class="fd">${ddmm(ks[i])}${x?` <span class="fm">${x==="p"?"✓":"✗"}</span>`:""}</span></button>`).join("");
    const end=full?`<button type="button" class="frn" data-rn="${s.id}">Renew</button>`:`<span class="fct">${pres}/${n}</span>`;
    const nextK=nextTrain(s.team,addDays(ks[n-1],1));
    const op=OPEN===s.id?`<div class="fed">
        <button type="button" class="btn sh-go" style="align-self:flex-start">Share card</button>
        <div class="row" style="align-items:end"><label>Renew from<select class="fr-date">${dayOpts(s.team,nextK)}</select></label>
        <button type="button" class="btn alt fr-go" style="flex:0 0 auto">Renew</button><button type="button" class="x fr-no" style="flex:0 0 auto">Close</button></div>${histHtml(s)}</div>`:"";
    const ed=EDIT===s.id?`<div class="fed">
        <div class="row"><label style="flex:0 1 80px">Position<input class="fe-pos" type="number" inputmode="numeric" min="1" max="${rows.length}" value="${ix+1}"></label><label>Name<input class="fe-name" maxlength="40" autocomplete="off"></label></div>
        <div class="row"><label style="flex:0 1 90px">Sessions<input class="fe-n" type="number" inputmode="numeric" min="1" max="40" value="${n}"></label>
        <label style="flex:0 1 90px">Renewals<input class="fe-r" type="number" inputmode="numeric" min="0" value="${+s.renewals||0}"></label>
        <label class="full">Start date<input class="fe-s" type="date" value="${s.start}"></label></div>
        <div class="row" style="align-items:center">
          <button type="button" class="btn fe-save" style="flex:0 0 auto">Save</button>
          ${s.prev?`<button type="button" class="x fe-undo" style="flex:0 0 auto">Undo renew</button>`:""}
          <button type="button" class="x fe-del" style="flex:0 0 auto">Delete swimmer</button>
        </div></div>`:"";
    return `<div class="fr${sn?" soon":""}" data-row="${s.id}"><div class="fn"><span class="fno">${ix+1}</span><button type="button" class="fnm" data-rn="${s.id}"></button>${+s.renewals?`<small>×${+s.renewals}</small>`:""}<button type="button" class="x ed" data-edit="${s.id}">${EDIT===s.id?"Close":"Edit"}</button></div>${end}<div class="fbx">${boxes}</div>${op}${ed}</div>`;
  }).join("");
  $("list").querySelectorAll(".fr").forEach(r=>{ const s=SW.find(x=>x.id===r.dataset.row); r.querySelector(".fnm").textContent=s.name; const ni=r.querySelector(".fe-name"); if(ni) ni.value=s.name; });
  const byDay={};
  rows.forEach(s=>{ const m=marksOf(s), ks=sessKeys(s.team,s.start,m.length); m.forEach((x,i)=>{ if(!x) return; (byDay[ks[i]]=byDay[ks[i]]||{p:0,a:0})[x]++; }); });
  const lastDay=Object.keys(byDay).sort().pop();
  if(lastDay){ const c=byDay[lastDay]; $("last").innerHTML=`<span>${wd(lastDay)} ${ddmm(lastDay)}</span><span class="ok">✓ Present <b>${c.p}</b></span><span class="bad">✗ Absent <b>${c.a}</b></span>`; $("last").hidden=false; }
  else $("last").hidden=true;
  $("sum").innerHTML=`<span>Swimmers: <b>${rows.length}</b></span><span>Need renewal soon: <b>${soon}</b></span><span>${T.days.map(d=>SHORT[d]).join(" · ")} · ${T.n} sessions</span>`;
  $("howto").textContent=`Tap any box to change it: empty → ✓ Present → ✗ Absent → empty. Tap a name to share the card or renew it. Orange name = 1 session left or finished.`;
  if(!$("aN").value||$("aN").dataset.team!==CUR){ $("aN").value=T.n; $("aN").dataset.team=CUR; }
}

$("tabs").addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(!b) return; CUR=b.dataset.tab; OPEN=EDIT=OLD=null; render(); });

async function move(id,pos){
  const s0=SW.find(x=>x.id===id), rows=SW.filter(s=>s.team===s0.team).sort((a,b)=>(a.order||0)-(b.order||0)), from=rows.findIndex(x=>x.id===id);
  pos=Math.min(Math.max(1,pos),rows.length)-1; if(from<0||from===pos) return;
  const [t]=rows.splice(from,1); rows.splice(pos,0,t);
  for(let i=0;i<rows.length;i++){ if(rows[i].order!==i+1) await save(rows[i].id,{order:i+1}); }
}
$("list").addEventListener("click",async e=>{
  const c=e.target.closest(".fc");
  if(c){ const s=SW.find(x=>x.id===c.dataset.id), m=marksOf(s), i=+c.dataset.i; m[i]=m[i]===""?"p":m[i]==="p"?"a":""; save(s.id,{marks:m}); return; }
  const rn=e.target.closest("[data-rn]");
  if(rn){ OPEN=OPEN===rn.dataset.rn?null:rn.dataset.rn; EDIT=null; OLD=null; render(); return; }
  const ed=e.target.closest("[data-edit]");
  if(ed){ EDIT=EDIT===ed.dataset.edit?null:ed.dataset.edit; OPEN=null; render(); return; }
  const row=e.target.closest(".fr"); if(!row) return; const s=SW.find(x=>x.id===row.dataset.row);
  if(e.target.closest(".sh-go")){ shareCard(s,e.target.closest(".sh-go")); return; }
  if(e.target.closest(".fr-no")){ OPEN=null; OLD=null; render(); return; }
  if(e.target.closest(".fo-open")){ OLD=s.id; render(); return; }
  if(e.target.closest(".fo-no")){ OLD=null; render(); return; }
  if(e.target.closest(".fo-save")){
    const st=row.querySelector(".fo-s").value, n=parseInt(row.querySelector(".fo-n").value,10), p=parseInt(row.querySelector(".fo-p").value,10), a=parseInt(row.querySelector(".fo-a").value,10);
    if(!(n>=1&&n<=40)||!(p>=0)||!(a>=0)||p+a>n){ fail("Check the numbers: present + absent can't be more than sessions."); return; }
    OLD=null; save(s.id,{hist:[...(s.hist||[]),{start:st,n,p,a}],renewals:(+s.renewals||0)+1}); return;
  }
  const hd=e.target.closest(".fh-del");
  if(hd){
    if(!hd.classList.contains("arm")){ hd.classList.add("arm"); hd.textContent="Sure?"; setTimeout(()=>{ if(hd.isConnected){hd.classList.remove("arm"); hd.textContent="Delete";} },3000); return; }
    const hi=+hd.dataset.hi, h=(s.hist||[]).filter((_,i)=>i!==hi);
    save(s.id,{hist:h,renewals:Math.max(h.length,(+s.renewals||0)-1),prev:null}); return;
  }
  if(e.target.closest(".fr-go")){ const st=row.querySelector(".fr-date").value; OPEN=null;
    save(s.id,{prev:{marks:marksOf(s),renewals:+s.renewals||0,start:s.start,n:nOf(s)},hist:[...(s.hist||[]),{start:s.start,marks:marksOf(s),n:nOf(s)}],marks:Array(TM(s.team).n).fill(""),n:TM(s.team).n,renewals:(+s.renewals||0)+1,start:st}); return; }
  if(e.target.closest(".fe-save")){
    const name=row.querySelector(".fe-name").value.trim(), n=parseInt(row.querySelector(".fe-n").value,10), r=parseInt(row.querySelector(".fe-r").value,10), st=row.querySelector(".fe-s").value;
    if(!name||!(n>=1&&n<=40)||!(r>=0)||!st){ fail("Check the name, sessions (1 to 40), renewals and start date."); return; }
    const lastMarked=marksOf(s).reduce((a,x,i)=>x?i+1:a,0);
    if(n<lastMarked){ fail(`Can't go below ${lastMarked} sessions: session ${lastMarked} is already marked.`); return; }
    const pos=parseInt(row.querySelector(".fe-pos").value,10);
    EDIT=null; await save(s.id,{name,n,renewals:r,marks:marksOf({...s,n}),start:st});
    if(pos>=1) await move(s.id,pos); return;
  }
  if(e.target.closest(".fe-undo")&&s.prev){ EDIT=null; save(s.id,{marks:s.prev.marks,renewals:s.prev.renewals,start:s.prev.start,n:s.prev.n||TM(s.team).n,prev:null,hist:(s.hist||[]).slice(0,-1)}); return; }
  const del=e.target.closest(".fe-del");
  if(del){
    if(!del.classList.contains("arm")){ del.classList.add("arm"); del.textContent="Sure? Tap again"; setTimeout(()=>{ if(del.isConnected){del.classList.remove("arm"); del.textContent="Delete swimmer";} },3000); return; }
    EDIT=null; delSw(s.id);
  }
});
$("addF").addEventListener("submit",async e=>{
  e.preventDefault(); const er=$("addErr"); er.hidden=true;
  const name=$("aName").value.trim(), n=parseInt($("aN").value,10), st=$("aStart").value;
  if(!name){er.textContent="Enter the swimmer's name.";er.hidden=false;return;}
  if(!st){er.textContent="Pick the start date.";er.hidden=false;return;}
  if(!(n>=1&&n<=40)){er.textContent="Sessions must be 1 to 40.";er.hidden=false;return;}
  const id="s"+Date.now().toString(36);
  $("aName").value=""; $("aName").focus();
  await addSw({id,team:CUR,name,n,start:st,marks:Array(n).fill(""),renewals:0,hist:[],order:Date.now()});
});
$("aStart").value=todayKey;

  y+=96+44;
  ctx.fillStyle=C.ink; ctx.font="600 40px "+FF; ctx.fillText(s.name,PAD,y+30);
  ctx.fillStyle=C.chip; ctx.font="italic 600 34px "+FF; ctx.textAlign="right"; ctx.fillText(TM(s.team).name.toUpperCase()+" TEAM",W-PAD,y+30); ctx.textAlign="left"; y+=54;
  ctx.fillStyle=C.muted; ctx.font="400 28px "+FF; ctx.fillText(yy(ks[0])+" → "+yy(ks[n-1]),PAD,y+22); y+=48;
  const rope=yy2=>{ ctx.strokeStyle=C.deep; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(PAD,yy2); ctx.lineTo(W-PAD,yy2); ctx.stroke(); let i=0; for(let x=PAD+8;x<=W-PAD-8;x+=28,i++){ ctx.fillStyle=i%5===0?C.deep:C.chip; ctx.beginPath(); ctx.arc(x,yy2,8,0,7); ctx.fill(); } };
  rope(y); y+=44;
  const colW=(W-2*PAD-40)/2;
  const chip=(x,y2,w,txt,fg,bg,bd)=>{ ctx.fillStyle=bg; ctx.fillRect(x,y2,w,50); ctx.strokeStyle=bd; ctx.lineWidth=2; ctx.strokeRect(x,y2,w,50); ctx.fillStyle=fg; let fs=24; ctx.font="600 "+fs+"px "+FF; while(fs>14&&ctx.measureText(txt).width>w-14){fs--;ctx.font="600 "+fs+"px "+FF;} ctx.textAlign="center"; ctx.fillText(txt,x+w/2,y2+34); ctx.textAlign="left"; };
  ks.forEach((k,i)=>{ const col=i<rowsPerCol?0:1, r=i%rowsPerCol, x=PAD+col*(colW+40), y2=y+r*rowH, st=states[i];
    ctx.strokeStyle=C.line; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x,y2+rowH-6); ctx.lineTo(x+colW,y2+rowH-6); ctx.stroke();
    ctx.fillStyle="rgba(11,87,112,.35)"; ctx.font="italic 600 34px "+FF; ctx.fillText(pad(i+1),x,y2+46);
    ctx.fillStyle=C.ink; ctx.font="600 30px "+FF; ctx.fillText(wd(k),x+64,y2+46);
    ctx.fillStyle=C.chip; ctx.font="600 30px "+FF; ctx.fillText(ddmm(k),x+170,y2+46);
    const cx=x+colW-130;
    if(st==="p") chip(cx,y2+12,130,"✓ Present",C.ok,C.oktint,C.ok);
    else if(st==="a") chip(cx,y2+12,130,"✕ Absent",C.bad,C.badtint,C.bad);
    else if(st==="u") chip(cx,y2+12,130,"Upcoming",C.muted,"#fff",C.line);
    else chip(cx,y2+12,130,"Not marked",C.muted,"#fff",C.line);
  });
  y+=rowsPerCol*rowH+24; rope(y); y+=40;
  ctx.fillStyle=C.chip; ctx.fillRect(PAD,y,W-2*PAD,110); ctx.fillStyle="#fff"; ctx.font="600 32px "+FF; ctx.fillText(done?"MONTH COMPLETE":"IN PROGRESS",PAD+36,y+66);
  ctx.font="italic 600 52px "+FF; ctx.textAlign="right"; ctx.fillText(pr+" of "+n,W-PAD-36,y+72); ctx.textAlign="left"; y+=110;
  ctx.fillStyle=C.line; ctx.fillRect(PAD,y,W-2*PAD,14); ctx.fillStyle=C.ok; ctx.fillRect(PAD,y,(W-2*PAD)*Math.min(1,pr/n),14); y+=14+36;
  const bw=(W-2*PAD-2*20)/3;
  const stats=[["ATTENDED",String(pr),C.ok],["REMAINING",String(left),left?C.chip:C.muted],["ABSENT",String(ab),ab?C.bad:C.muted]];
  stats.forEach((st,i)=>{ const x=PAD+i*(bw+20); ctx.strokeStyle=C.line; ctx.lineWidth=2; ctx.strokeRect(x,y,bw,128);
    ctx.fillStyle=C.muted; ctx.font="600 21px "+FF; ctx.textAlign="center"; ctx.fillText(st[0],x+bw/2,y+40);
    ctx.fillStyle=st[2]; ctx.font="italic 600 60px "+FF; ctx.fillText(st[1],x+bw/2,y+102); ctx.textAlign="left"; });
  y+=128+PAD;
  const o2=document.createElement("canvas"); o2.width=W; o2.height=y; o2.getContext("2d").drawImage(cv,0,0);
  return await new Promise((res,rej)=>o2.toBlob(b=>b?res(b):rej(new Error("png")),"image/png"));
}
function cardOverlay(url,name){
  const ov=document.createElement("div"); ov.className="cardOv";
  ov.innerHTML=`<div class="row2"><a class="btn" download="${name}" href="${url}">Download</a><button class="btn alt" type="button" style="background:#fff">Close</button></div><img alt="Training card" src="${url}"><p class="note" style="color:#fff;margin:0">Press and hold the image to save or share it.</p>`;
  ov.querySelector("button").onclick=()=>{ov.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);};
  document.body.appendChild(ov);
}
async function shareCard(s,btn){
  const old=btn.textContent; btn.disabled=true; btn.textContent="Preparing…";
  try{
    const blob=await cardBlob(s), name="Training-Card-"+s.name.replace(/[^A-Za-z0-9]+/g,"-")+"-"+s.start+".png", file=new File([blob],name,{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ try{await navigator.share({files:[file]}); return;}catch(e){ if(e&&e.name==="AbortError") return; } }
    cardOverlay(URL.createObjectURL(blob),name);
  }catch(e){ fail("Couldn't make the card. Try again."); }
  finally{ btn.disabled=false; btn.textContent=old; }
}

/* BACKUP */
const strip=s=>Object.fromEntries(Object.entries(s).filter(([k])=>k!=="prev"));
$("bkBtn").addEventListener("click",()=>{
  const msg=$("bkMsg"), d=new Date(), name=`TEAM-backup-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.json`;
  try{ const blob=new Blob([JSON.stringify({app:"TEAM",version:1,swimmers:SW.map(strip)},null,1)],{type:"application/json"}), a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    msg.textContent="Backup saved: "+name; msg.style.color="var(--ok)"; msg.hidden=false;
  }catch(e){ msg.textContent="Backup didn't download. Try again."; msg.style.color="var(--bad)"; msg.hidden=false; }
});
let IMP=null;
$("impFile").addEventListener("change",async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return; const msg=$("bkMsg");
  try{ const j=JSON.parse(await f.text()); if(j.app!=="TEAM"||!Array.isArray(j.swimmers)) throw 0;
    IMP=j.swimmers.filter(s=>s&&s.id&&s.name&&TM(s.team));
    const by=TEAMS.map(t=>`${t.name} ${IMP.filter(s=>s.team===t.id).length}`).join(", ");
    $("impInfo").textContent=`This backup has ${IMP.length} swimmers (${by}). Importing adds them here. A swimmer already here is replaced by the backup copy.`;
    $("impBox").hidden=false; msg.hidden=true;
  }catch(x){ msg.textContent="That file isn't a TEAM backup."; msg.style.color="var(--bad)"; msg.hidden=false; }
});
$("impNo").addEventListener("click",()=>{IMP=null;$("impBox").hidden=true;});
$("impGo").addEventListener("click",async()=>{
  if(!IMP) return; const list=IMP, msg=$("bkMsg"); IMP=null; $("impBox").hidden=true;
  try{ for(let i=0;i<list.length;i+=400){ const b=writeBatch(fs); list.slice(i,i+400).forEach(s=>b.set(fDoc(fs,COL,s.id),body(s))); await b.commit(); }
    msg.textContent=`Imported ${list.length} swimmers.`; msg.style.color="var(--ok)"; msg.hidden=false;
  }catch(x){ msg.textContent="Import didn't finish. Check your internet and try again."; msg.style.color="var(--bad)"; msg.hidden=false; }
});
/* SIGN IN / OUT */
let STARTED=false;
onAuthStateChanged(auth,user=>{
  $("booting").hidden=true;
  if(user){
    $("login").hidden=true; $("app").hidden=false; $("outBtn").hidden=false;
    if(!STARTED){ STARTED=true;
      fSnap(fCol(fs,COL),snap=>{ SW=snap.docs.map(d=>({id:d.id,...d.data()})).filter(s=>s.name&&s.start&&TM(s.team)); render(); },()=>fail("Lost connection to your saved data. Reload the page."));
    }
  }else{
    if(STARTED){location.reload();return;}
    $("app").hidden=true; $("outBtn").hidden=true; $("login").hidden=false;
  }
});
$("login").addEventListener("submit",async e=>{
  e.preventDefault();
  const er=$("lgErr"), btn=$("lgBtn"), em=$("lgEmail").value.trim(), pw=$("lgPass").value; er.hidden=true;
  if(!em||!pw){er.textContent="Enter your email and password.";er.hidden=false;return;}
  btn.disabled=true; btn.textContent="Signing in…";
  try{ await signInWithEmailAndPassword(auth,em,pw); $("lgPass").value=""; }
  catch(x){
    const c=x&&x.code||"";
    er.textContent=c.includes("too-many")?"Too many tries. Wait a few minutes and try again.":c.includes("network")?"No internet. Check your connection.":"Wrong email or password.";
    er.hidden=false;
  }
  btn.disabled=false; btn.textContent="Sign in";
});
let outArm=false;
$("outBtn").onclick=()=>{
  const b=$("outBtn");
  if(!outArm){outArm=true;b.textContent="Sure? Tap again";setTimeout(()=>{outArm=false;b.textContent="Sign out"},3000);return;}
  signOut(auth);
};
render();
</script>
